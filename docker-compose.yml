services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - AUTH_INTERNAL_URL=http://auth:3001
    depends_on:
      - auth
      - backend

  auth:
    build: ./auth
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    volumes:
      - ./data:/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data

services:
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_BACKEND_URL=https://streamly.boodoo.dev
        - NEXT_PUBLIC_AUTH_URL=https://streamly.boodoo.dev
        - NEXT_PUBLIC_API_URL=https://streamly.boodoo.dev
    ports:
      - "3003:3000"
    environment:
      - AUTH_INTERNAL_URL=http://auth:3001
    depends_on:
      - auth
      - backend

  auth:
    build: ./auth
    ports:
      - "3004:3001"
    environment:
      - PORT=3001
      - CORS_ORIGIN=https://streamly.boodoo.dev
    volumes:
      - ./data:/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - CORS_ORIGIN=https://streamly.boodoo.dev
    volumes:
      - ./data:/data
